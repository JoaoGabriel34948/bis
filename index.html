<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscoito da Sorte</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte simplificada -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>✨ Biscoito da Sorte ✨</h1>
        <p>Receba a mensagem certa para o seu momento.</p>
    </header>

    <main class="container">
        <!-- ETAPA 1: FORMULÁRIO -->
        <section id="step-form" class="card">
            <h2>Personalize sua Revelação</h2>

            <div class="input-group">
                <label for="user-name">Seu Nome (opcional):</label>
                <input type="text" id="user-name" placeholder="Ex: Maria">
            </div>

            <div class="input-group">
                <label>Área de orientação:</label>
                <div class="chips-container">
                    <label class="chip"><input type="checkbox" name="category" value="carreira"> 💼 Carreira</label>
                    <label class="chip"><input type="checkbox" name="category" value="amor"> ❤️ Amor</label>
                    <label class="chip"><input type="checkbox" name="category" value="crescimento"> 🌱 Crescimento</label>
                    <label class="chip"><input type="checkbox" name="category" value="saude"> 🧠 Saúde Mental</label>
                </div>
            </div>

            <div class="input-group">
                <label>Como você se sente?</label>
                <div class="chips-container">
                    <label class="chip"><input type="checkbox" name="mood" value="ansioso"> ⚡ Ansioso</label>
                    <label class="chip"><input type="checkbox" name="mood" value="motivado"> 🔥 Motivado</label>
                    <label class="chip"><input type="checkbox" name="mood" value="cansado"> 🛋️ Cansado</label>
                    <label class="chip"><input type="checkbox" name="mood" value="esperancoso"> ✨ Esperançoso</label>
                </div>
            </div>

            <button id="btn-prepare" class="btn-primary">Criar Biscoito</button>
        </section>

        <!-- ETAPA 2: BISCOITO -->
        <section id="step-cookie" class="card hidden">
            <p id="instruction-text">Clique no biscoito para quebrá-lo</p>
            <div id="cookie-btn" class="cookie-wrapper">
                <div class="paper-strip">SORTE</div>
                <div class="cookie-part cookie-left"></div>
                <div class="cookie-part cookie-right"></div>
            </div>
        </section>

        <!-- ETAPA 3: RESULTADO -->
        <section id="step-result" class="card hidden">
            <div class="fortune-paper">
                <h3 id="result-greeting">Sua Mensagem:</h3>
                <p id="result-message" class="quote">"..."</p>

                <div class="lucky-numbers-container">
                    <span>Números da sorte:</span>
                    <div id="lucky-numbers" class="numbers-box"></div>
                </div>

                <button id="btn-restart" class="btn-secondary">Abrir Outro Biscoito 🥠</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
