<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscoito da Sorte 3D Personalizado</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="stars"></div>
    <div class="container">
        
        <!-- CABEÇALHO -->
        <header>
            <h1>✨ Biscoito da Sorte ✨</h1>
            <p>Conecte-se com sua energia e receba a mensagem certa para o seu momento.</p>
        </header>

        <!-- ETAPA 1: FORMULÁRIO DE PERSONALIZAÇÃO -->
        <section id="step-form" class="card">
            <h2>Personalize sua Revelação</h2>
            
            <div class="input-group">
                <label for="user-name">Seu Nome (opcional):</label>
                <input type="text" id="user-name" placeholder="Ex: Maria">
            </div>

            <div class="input-group">
                <label>Em qual área da vida você precisa de orientação hoje?</label>
                <div class="chips-container">
                    <label class="chip">
                        <input type="checkbox" name="category" value="carreira">
                        <span>💼 Carreira & Finanças</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="category" value="amor">
                        <span>❤️ Amor & Relacionamentos</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="category" value="crescimento">
                        <span>🌱 Crescimento Pessoal</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="category" value="saude">
                        <span>🧠 Paz & Saúde Mental</span>
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label>Como você se sente no momento?</label>
                <div class="chips-container">
                    <label class="chip">
                        <input type="checkbox" name="mood" value="ansioso">
                        <span>⚡ Ansioso / Inseguro</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="mood" value="motivado">
                        <span>🔥 Motivado / Pronto</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="mood" value="cansado">
                        <span>🛋️ Cansado / Reflexivo</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="mood" value="esperancoso">
                        <span>✨ Esperançoso</span>
                    </label>
                </div>
            </div>

            <button id="btn-prepare" class="btn-primary">Criar Meu Biscoito da Sorte</button>
        </section>

        <!-- ETAPA 2: BISCOITO 3D -->
        <section id="step-cookie" class="card hidden">
            <p id="instruction-text" class="pulse-text">👇 Clique no biscoito para quebrá-lo em 3D 👇</p>
            
            <div class="cookie-stage">
                <div class="cookie-wrapper" id="cookie-btn">
                    
                    <div class="cookie-3d-container">
                        
                        <!-- Papel saindo de dentro -->
                        <div class="paper-peek-3d"></div>

                        <!-- Metade Esquerda (3D Rendered) -->
                        <div class="cookie-half left-half">
                            <svg viewBox="0 0 240 240" class="cookie-svg-3d">
                                <defs>
                                    <linearGradient id="cookie3d-base-left" x1="10%" y1="0%" x2="90%" y2="100%">
                                        <stop offset="0%" stop-color="#ffedd5" />
                                        <stop offset="25%" stop-color="#fde047" />
                                        <stop offset="60%" stop-color="#d97706" />
                                        <stop offset="100%" stop-color="#78350f" />
                                    </linearGradient>
                                    
                                    <radialGradient id="cookie3d-shadow-left" cx="50%" cy="50%" r="50%">
                                        <stop offset="0%" stop-color="#451a03" stop-opacity="0.8" />
                                        <stop offset="100%" stop-color="#451a03" stop-opacity="0" />
                                    </radialGradient>

                                    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
                                        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
                                    </filter>
                                </defs>

                                <!-- Corpo Principal Esquerdo -->
                                <path d="M 120 25 C 65 25, 20 70, 20 120 C 20 170, 65 195, 115 170 C 85 130, 80 75, 120 25 Z" fill="url(#cookie3d-base-left)" filter="url(#glow-light)" />
                                <!-- Dobra e Volume 3D -->
                                <path d="M 120 25 C 80 75, 85 130, 115 170 C 100 155, 90 120, 110 80 Z" fill="url(#cookie3d-shadow-left)" />
                                <!-- Brilho Superior 3D -->
                                <path d="M 120 25 C 70 30, 30 75, 25 120 C 35 80, 75 40, 120 25 Z" fill="#ffffff" opacity="0.4" />
                            </svg>
                        </div>

                        <!-- Metade Direita (3D Rendered) -->
                        <div class="cookie-half right-half">
                            <svg viewBox="0 0 240 240" class="cookie-svg-3d">
                                <defs>
                                    <linearGradient id="cookie3d-base-right" x1="90%" y1="0%" x2="10%" y2="100%">
                                        <stop offset="0%" stop-color="#fff7ed" />
                                        <stop offset="25%" stop-color="#facc15" />
                                        <stop offset="60%" stop-color="#c2410c" />
                                        <stop offset="100%" stop-color="#451a03" />
                                    </linearGradient>

                                    <radialGradient id="cookie3d-shadow-right" cx="50%" cy="50%" r="50%">
                                        <stop offset="0%" stop-color="#270e02" stop-opacity="0.9" />
                                        <stop offset="100%" stop-color="#270e02" stop-opacity="0" />
                                    </radialGradient>
                                </defs>

                                <!-- Corpo Principal Direito -->
                                <path d="M 120 25 C 175 25, 220 70, 220 120 C 220 170, 175 195, 125 170 C 155 130, 160 75, 120 25 Z" fill="url(#cookie3d-base-right)" filter="url(#glow-light)" />
                                <!-- Dobra e Volume 3D -->
                                <path d="M 120 25 C 160 75, 155 130, 125 170 C 140 155, 150 120, 130 80 Z" fill="url(#cookie3d-shadow-right)" />
                                <!-- Brilho Superior 3D -->
                                <path d="M 120 25 C 170 30, 210 75, 215 120 C 205 80, 165 40, 120 25 Z" fill="#ffffff" opacity="0.3" />
                            </svg>
                        </div>

                    </div>

                    <!-- Sombra 3D no Chão -->
                    <div class="cookie-shadow-3d"></div>

                </div>
            </div>
        </section>

        <!-- ETAPA 3: RESULTADO DA MENSAGEM -->
        <section id="step-result" class="hidden">
            <div class="fortune-paper">
                <div class="paper-decoration">★ ★ ★</div>
                <h3 id="result-greeting">Sua Mensagem:</h3>
                <p id="result-message" class="quote">"..."</p>
                
                <div class="lucky-numbers-container">
                    <span>Seus números da sorte:</span>
                    <div id="lucky-numbers" class="numbers-box"></div>
                </div>

                <button id="btn-restart" class="btn-secondary">Abrir Outro Biscoito 🥠</button>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
